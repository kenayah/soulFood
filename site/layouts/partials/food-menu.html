{{ if hugo.Data.homepage.pricing.enable }}
{{ with hugo.Data.homepage.pricing }}
<section id="price">
	<div class="container">
		<div class="row">
			<div class="col-md-12">
				<div class="block">
					<h1 class="heading wow fadeInUp" data-wow-duration="300ms" data-wow-delay="300ms">
						{{ .title | markdownify }}</h1>
					<p class="wow fadeInUp" data-wow-duration="300ms" data-wow-delay="400ms">
						{{ .description | markdownify }}</p>
					<div id="dynamic-menu" class="pricing-list"></div>
				</div>
			</div>
		</div>
	</div>
</section>
{{end}}
{{end}}
