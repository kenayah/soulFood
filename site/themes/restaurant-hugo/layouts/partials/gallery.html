{{ if hugo.Data.homepage.gallery.enable }}
{{ with hugo.Data.homepage.gallery }}
<section id="slider">
	<div class="container">
		<div class="row">
			<div class="col-md-12">
				<div class="block wow fadeInUp" data-wow-duration="500ms" data-wow-delay="300ms">
					<div class="title">
						<h3>{{ .title | markdownify }}</h3>
					</div>
				<div class="gallery-slider">
					{{ range .images }}
					<div class="slide-item">
						<a href="{{ .image | absURL }}" class="venobox" data-gall="sliderGallery"><img class="img-responsive"
								src="{{ .image | absURL }}" alt="{{ .caption }}"></a>
						<div>
							<div class="slide-caption">
								<strong>{{ .caption }}</strong>
								{{ with .description }}<span>{{ . }}</span>{{ end }}
							</div>
						</div>
					</div>
					{{ end }}
				</div>
				</div>
			</div><!-- .col-md-12 close -->
		</div><!-- .row close -->
	</div><!-- .container close -->
</section><!-- slider close -->
{{end}}
{{end}}
